<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
    <meta name="renderer" content="webkit">
    <title>ShizukuBot - 登录</title>
    <link rel="stylesheet" href="https://unpkg.com/mdui@2.1.5/mdui.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        body {isolation:isolate;}
        .page-background {position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;pointer-events:none;}
        .login-card {
            width: 424px;
            padding: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: rgba(var(--mdui-color-surface), .94);
            box-sizing: border-box;
            max-width: calc(100% - 32px);
        }
        .login-logo {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            background-color: rgb(var(--mdui-color-primary-container));
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }
        .login-title {
            font-size: 24px;
            font-weight: 600;
            color: rgb(var(--mdui-color-on-surface));
            margin-bottom: 4px;
        }
        .login-subtitle {
            font-size: 14px;
            color: rgb(var(--mdui-color-on-surface-variant));
            margin-bottom: 32px;
        }
        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .login-form mdui-text-field {
            width: 100%;
        }
        .login-error {
            color: rgb(var(--mdui-color-error));
            font-size: 14px;
            min-height: 20px;
            text-align: center;
        }
        @media (max-width:839px) {.page-background {position:absolute;} .login-card {padding:24px;}}
        @media (prefers-reduced-motion:reduce) {mdui-button {transition:none !important; transform:none !important;}}
        .login-footer {
            margin-top: 24px;
            font-size: 12px;
            color: rgb(var(--mdui-color-on-surface-variant));
            text-align: center;
        }
    </style>
    <script src="https://unpkg.com/mdui@2.1.5/mdui.global.js"></script>
    <script src="/appearance/bootstrap.js"></script>
    <script src="/static/js/appearance.js"></script>
</head>
<body>
    <img class="page-background" data-default-src="/static/img/default-background.png" alt="" aria-hidden="true" referrerpolicy="no-referrer">
    <script>AppearanceUI.attachBackground();</script>
    <mdui-card variant="outlined" class="login-card">
        <div class="login-logo">
            <mdui-icon name="smart_toy" style="font-size:40px;color:rgb(var(--mdui-color-primary))"></mdui-icon>
        </div>
        <div class="login-title">ShizukuBot</div>
        <div class="login-subtitle">管理后台</div>
        <form class="login-form" id="login-form">
            <mdui-text-field
                label="用户名"
                value="admin"
                id="username" autocomplete="username"
                icon="person">
            </mdui-text-field>
            <mdui-text-field
                label="密码"
                type="password"
                id="password" autocomplete="current-password"
                icon="lock"
                toggle-password>
            </mdui-text-field>
            <div class="login-error" id="error-msg" role="alert" aria-live="polite"></div>
            <mdui-button type="submit" variant="filled" full-width icon="login" id="login-submit">登录</mdui-button>
        </form>
        <div class="login-footer">ShizukuBot</div>
    </mdui-card>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const button = document.getElementById('login-submit');
            if (button.loading) return;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            errorMsg.textContent = '';
            if (!username.trim() || !password) {errorMsg.textContent = '请输入用户名和密码';return;}
            button.loading = true; button.disabled = true;

            try {
                const resp = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password }),
                });
                const data = await resp.json();
                if (data.code === 0) {
                    window.location.href = '/';
                } else {
                    errorMsg.textContent = data.message || '登录失败';
                }
            } catch (err) {
                errorMsg.textContent = '无法连接服务器，请重试';
            } finally {button.loading = false; button.disabled = false;}
        });
    </script>
</body>
</html>
